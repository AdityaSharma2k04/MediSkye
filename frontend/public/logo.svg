<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#06B6D4" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0891B2" flood-opacity="0.45"/>
    </filter>

    <!-- Main Vertical Cyan Gradient -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="42%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Inner Rim Highlight Gradient -->
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Squircle -->
  <rect x="48" y="48" width="416" height="416" rx="108" fill="#0891B2" opacity="0.35" filter="url(#outerGlow)"/>

  <!-- Main Squircle Body -->
  <rect x="48" y="48" width="416" height="416" rx="108" fill="url(#cyanGradient)" stroke="#67E8F9" stroke-width="8" stroke-opacity="0.75"/>

  <!-- Inner Embossed Glow Ring -->
  <rect x="76" y="76" width="360" height="360" rx="90" fill="none" stroke="url(#rimGradient)" stroke-width="7" stroke-opacity="0.85"/>

  <!-- Center Dark ECG Pulse Waveform -->
  <path d="M 148 264 L 210 264 L 238 176 L 282 344 L 312 264 L 364 264" fill="none" stroke="#060A12" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

