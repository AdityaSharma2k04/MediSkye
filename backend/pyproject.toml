[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires external services (Gemini, network, real DB)",
  "slow: takes longer than 1 second",
  "unit: fast, no external dependencies",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:slowapi.*",
    "ignore::DeprecationWarning:langchain_community.*",
    "ignore::DeprecationWarning:google.genai.*",
]